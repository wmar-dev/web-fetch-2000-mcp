name: CI

on:
  push:
  pull_request:

jobs:
  offline:
    name: offline suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m "not browser and not slow and not live"

  browsers:
    name: browser suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: offline
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      - run: uv run python -m camoufox fetch
      - run: uv run pytest -m browser
      - run: uv run pytest -m slow

  docker:
    name: container images
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: docker build --target slim -t web-fetch-2000:slim .
      - run: docker build --target full -t web-fetch-2000:full .
      - run: uv run python scripts/smoke_container.py web-fetch-2000:slim
      - run: uv run python scripts/smoke_container.py web-fetch-2000:full --browsers
