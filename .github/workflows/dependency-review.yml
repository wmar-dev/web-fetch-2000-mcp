name: Dependency review

on:
  pull_request:
    paths:
      - "uv.lock"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
