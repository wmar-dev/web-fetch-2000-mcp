[project]
name = "web-fetch-2000-mcp"
version = "0.1.0"
description = "MCP server that fetches web content through an escalating ladder of strategies (HTTP, Chromium, Camoufox) and remembers which works best per site."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.30,<2",
    "httpx[http2]>=0.27",
    # Camoufox 0.5.x requires playwright<1.63
    "playwright>=1.50,<1.63",
    "camoufox>=0.5.8",
    "trafilatura>=2.0",
    "pypdf>=5",
    "platformdirs>=4",
    "pydantic>=2.7",
]

[project.scripts]
webfetch2000 = "webfetch2000.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "psutil>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webfetch2000"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser: needs real Playwright Chromium / Camoufox binaries",
    "slow: long-running load tests",
    "live: opt-in benchmark against live websites",
]
addopts = "-m 'not browser and not slow and not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC109"]  # explicit timeout parameters are intentional here

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "B011", "UP031"]
